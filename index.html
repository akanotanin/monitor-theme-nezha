<!doctype html>
<html lang="en">
  <head>
    <script>
      ;(() => {
        const storageKey = "vite-ui-theme"
        const root = document.documentElement
        const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)")

        const resolveTheme = (theme) =>
          theme === "system" ? (mediaQuery.matches ? "dark" : "light") : theme

        function updateThemeColor(nextTheme) {
          const themeColor = nextTheme === "dark" ? "hsl(30 15% 8%)" : "hsl(0 0% 98%)"
          let meta = document.querySelector('meta[name="theme-color"]')

          if (!meta) {
            meta = document.createElement("meta")
            meta.setAttribute("name", "theme-color")
            document.head.appendChild(meta)
          }

          meta.setAttribute("content", themeColor)
        }

        function applyResolvedTheme(resolvedTheme) {
          root.classList.remove("light", "dark")
          root.classList.add(resolvedTheme)
          root.style.colorScheme = resolvedTheme
          root.style.backgroundColor =
            resolvedTheme === "dark" ? "hsl(30 15% 8%)" : "hsl(0 0% 98%)"
          updateThemeColor(resolvedTheme)
        }

        let theme = "system"

        try {
          const storedTheme = localStorage.getItem(storageKey)
          if (storedTheme === "light" || storedTheme === "dark" || storedTheme === "system") {
            theme = storedTheme
          }
        } catch (_e) {
          theme = "system"
        }

        applyResolvedTheme(resolveTheme(theme))

        // Add loaded class after React has mounted
        window.addEventListener("load", () => {
          const root = document.getElementById("root")
          if (root) {
            // 使用 RAF 确保在下一帧渲染
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                root.classList.add("loaded")
              })
            })
          }
        })
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 图标的头一步（贴缓存 / 冷启动时早问一次主题设置）：public/nezha-icon-probe.js。
         必须紧跟上面那行、且在入口包之前 —— 它要赶在浏览器去取 favicon 之前改掉 <link>，
         否则站长换过图标的站，标签页会先闪一下主题自带那张（实测：改造前 +40ms 是自带图、
         +269ms 才换成站长那张）。 -->
    <script src="/nezha-icon-probe.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 标签页标题的占位值：静态 HTML 不可能知道站长把站名改成了什么，
         真站名要到 JS 里才有。这里沿用上游那句（与 Header.tsx 里那句兜底值同值），
         换成主题名（Monitor Nezha）只会让每次加载凭空多一跳。 -->
    <title>哪吒监控 Nezha Monitoring</title>
    <!-- 标题的头一步（贴缓存里的站名 / 冷启动时早问一次 /api/me）：public/nezha-title-probe.js，
         与 src/components/Header.tsx 里的 TITLE_CACHE_KEY 共用一个键。独立文件而不是内联脚本——
         站点前面若有 CSP，内联脚本会被挡掉。 -->
    <script src="/nezha-title-probe.js"></script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="hsl(0 0% 98%)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- iOS「添加到主屏」显示的名字。占位值沿用上游那句（与静态清单的 name 同值），
         不在静态文件里写主题名：真站名到手后由 src/monitor/site-identity.ts 改写。 -->
    <meta name="apple-mobile-web-app-title" content="Nezha Monitoring" />
    <link rel="apple-touch-icon" href="/android-chrome-192x192.png" />

    <link rel="stylesheet" href="/vendor/flag-icons.min.css" />
    <link rel="stylesheet" href="/vendor/font-logos.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
